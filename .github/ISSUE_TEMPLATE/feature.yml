name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. If you plan to build it yourself, say so.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This does not submit applications automatically, add parallel or faster fetching, or put personal data in the repo.
          required: true

name: CI

on:
  pull_request:
    branches: [dev, stage, prod]
  push:
    branches: [dev, stage, prod]

# Read-only token, and no secrets are used anywhere in this workflow, so a
# pull request from a fork can run it safely. Never switch the trigger to
# pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The dependency scan only warns on dev so findings don't block day-to-day
  # work. Anything headed for stage or prod must pass it.
  SECURITY_WARN_ONLY: ${{ github.base_ref == 'dev' || github.ref == 'refs/heads/dev' }}

# Tests never touch the network: adapters are covered by recorded fixtures.
# Actions are pinned to full commit SHAs.
jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock.txt
            backend/requirements-dev-lock.txt
      - run: pip install -r requirements-lock.txt -r requirements-dev-lock.txt
      - run: pip install --no-deps -e ".[dev]"
      - run: python -m pytest -q

  frontend:
    name: frontend (typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  branch-flow:
    name: branch-flow (dev -> stage -> prod)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Only dev may merge into stage, and only stage into prod
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "stage" ] && [ "$HEAD" != "dev" ]; then
            echo "PRs into stage must come from dev (this one is from $HEAD)." >&2; exit 1
          fi
          if [ "$BASE" = "prod" ] && [ "$HEAD" != "stage" ]; then
            echo "PRs into prod must come from stage (this one is from $HEAD)." >&2; exit 1
          fi
          echo "OK: $HEAD -> $BASE"

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Always blocking. Full history; runs as the runner user so git trusts the checkout.
      # Image: zricethezav/gitleaks v8.30.1, pinned by digest.
      - name: Scan the full history for secrets
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner .

  # Known vulnerabilities in every locked dependency.
  security-deps:
    name: security-deps (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image: ghcr.io/google/osv-scanner v2.7.0, pinned by digest.
      - id: osv
        continue-on-error: ${{ env.SECURITY_WARN_ONLY == 'true' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 \
            scan source --lockfile backend/requirements-lock.txt --lockfile frontend/package-lock.json \
              --config osv-scanner.toml
      - if: steps.osv.outcome == 'failure'
        run: echo "::warning title=OSV-Scanner::Findings above. Warning only on dev; this blocks stage and prod."

# Shared board list, included from profiles/new-grad-cs.yaml. Split out so a
# second profile (e.g. a broader SWE one) can reuse the same company list with
# different filters instead of copy-pasting boards.
#
# Tokens checked against the live APIs on 2026-08-28. The ones commented out
# 404'd -- the company either isn't on that ATS anymore or the slug is wrong.

boards:
  greenhouse:
    - {company: Appian,               token: appian}
    - {company: Datadog,              token: datadog}
    - {company: Wiz,                  token: wizinc}
    - {company: Databricks,           token: databricks}
    - {company: Cloudflare,           token: cloudflare}
    - {company: Stripe,               token: stripe}
    - {company: Airbnb,               token: airbnb}
    - {company: Instacart,            token: instacart}
    - {company: Robinhood,            token: robinhood}
    - {company: Klaviyo,              token: klaviyo}
    - {company: Toast,                token: toast}
    - {company: MongoDB,              token: mongodb}
    - {company: Anthropic,            token: anthropic}

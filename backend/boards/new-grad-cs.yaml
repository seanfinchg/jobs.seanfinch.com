    # - {company: Netflix,              token: netflix}
    # - {company: Plaid,                token: plaid}

  ashby:
    - {company: OpenAI,               token: openai}
    - {company: Vanta,                token: vanta}
    - {company: Linear,               token: linear}

  smartrecruiters: []
    # - {company: Visa,                 token: visa}   # 200, 0 postings -- token unconfirmed

  workable: []
    # no confirmed Workable token from the actual target list yet

  simplify_listings:
    # Aggregator, not a company board -- surfaces postings/companies that
    # aren't configured as a direct board yet. content_hash dedup + the
    # native-apply_url preference in db.py mean this never shadows a
    # direct-source hit, it only adds coverage.
    - {token: new-grad}

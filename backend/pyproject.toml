[project]
name = "jobfinder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
apply = ["playwright"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobfinder*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long lines left are SQL, inline HTML and message strings, which the formatter does not wrap.
ignore = ["E501"]

[tool.pyright]
include = ["jobfinder", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

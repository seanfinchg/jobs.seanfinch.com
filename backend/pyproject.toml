[project]
name = "jobfinder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
apply = ["playwright"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobfinder*"]

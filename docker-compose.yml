# Clone this repo onto the deploy host and run `docker compose up -d --build`
# from this directory -- NOT via a "paste YAML" app installer. Those only
# accept YAML text with nowhere to also hand them this repo's source tree, so
# `build: .` has nothing to build from there; it only works with a pre-built
# `image:` reference.
# See redeploy-watch.sh for keeping this up to date via `git pull` without
# re-SSHing in every time. One service; the only inbound port is the status
# dashboard below (jobfinder/status_server.py). Everything else the container
# does is outbound-only (ATS APIs, Netlify's deploy API).
services:
  jobfinder:
    build: .
    restart: unless-stopped
    ports:
      # No auth -- binds every host interface, so keep this port behind a
      # firewall or private network and never forward it publicly. See
      # status_server.py's own comment for the trust boundary.
      - "8787:8787"
    environment:
      # Scoped Netlify auth token + the target site's id -- create both in
      # Netlify's dashboard, never commit them. Without these set, the
      # container still ingests and builds the dashboard, it just skips
      # the deploy step (see docker-entrypoint.sh).
      NETLIFY_AUTH_TOKEN: "${NETLIFY_AUTH_TOKEN:?set in .env, not here}"
      NETLIFY_SITE_ID: "${NETLIFY_SITE_ID:?set in .env, not here}"
      JOBFINDER_DATA_DIR: /data
      JOBFINDER_INTERVAL_SECONDS: "86400"
    volumes:
      # This is the only thing that needs to survive a container
      # rebuild/update; keep it on real persistent storage.
      - jobfinder-data:/data

volumes:
  jobfinder-data:
